<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Memory Ones - Birthday AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    #soundButton {

      position: fixed;

      z-index: 99999;

      left: 50%;
      bottom: 30px;

      transform: translateX(-50%);

      padding: 15px 25px;

      border: none;

      border-radius: 30px;

      background: black;

      color: white;

      font-size: 18px;

      font-weight: bold;

      display: none;

      cursor: pointer;

    }

  </style>

</head>


<body>


  <!-- SOUND BUTTON -->

  <button id="soundButton">
    🔊 PLAY WITH SOUND
  </button>



  <!-- AR SCENE -->

  <a-scene

    mindar-image="imageTargetSrc: ./targets.mind;"

    color-space="sRGB"

    renderer="colorManagement: true"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">


    <!-- VIDEO -->

    <a-assets>

      <video

        id="myVideo"

        src="./birthday.mp4"

        preload="auto"

        loop

        muted

        playsinline

        webkit-playsinline>

      </video>

    </a-assets>



    <!-- CAMERA -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false">

    </a-camera>



    <!-- IMAGE TARGET -->

    <a-entity

      id="target"

      mindar-image-target="targetIndex: 0">


      <!-- BIRTHDAY VIDEO -->

    <a-video
    id="arVideo"
    geometry="primitive: plane; width: 0.5625; height: 1"
    position="0 0 0"
    rotation="0 0 0">

    </a-video>


    </a-entity>


  </a-scene>



  <script>


    // =========================
    // GET ELEMENTS
    // =========================

    const target =
      document.querySelector("#target");

    const video =
      document.querySelector("#myVideo");

    const arVideo =
      document.querySelector("#arVideo");

    const soundButton =
      document.querySelector("#soundButton");



    // =========================
    // SET VIDEO AS AR TEXTURE
    // =========================

    arVideo.setAttribute(
      "src",
      "#myVideo"
    );



    // =========================
    // TARGET FOUND
    // =========================

    target.addEventListener(
      "targetFound",
      function () {

        console.log("TARGET FOUND");


        // Start video from beginning

        video.currentTime = 0;


        // Start muted

        video.muted = true;


        // Play video

        video.play()

          .then(function () {

            console.log(
              "BIRTHDAY VIDEO PLAYING"
            );

          })

          .catch(function (error) {

            console.log(
              "VIDEO ERROR:",
              error
            );

          });


        // Show sound button

        soundButton.style.display =
          "block";

      }
    );



    // =========================
    // SOUND BUTTON
    // =========================

    soundButton.addEventListener(
      "click",
      function () {

        console.log(
          "SOUND BUTTON CLICKED"
        );


        // Enable sound

        video.muted = false;

        video.volume = 1.0;


        // Continue video with sound

        video.play()

          .then(function () {

            console.log(
              "BIRTHDAY VIDEO + SOUND PLAYING"
            );


            // Hide button

            soundButton.style.display =
              "none";

          })

          .catch(function (error) {

            console.log(
              "AUDIO ERROR:",
              error
            );

          });

      }
    );



    // =========================
    // TARGET LOST
    // =========================

    target.addEventListener(
      "targetLost",
      function () {

        console.log(
          "TARGET LOST"
        );


        // Pause video

        video.pause();


        // Hide sound button

        soundButton.style.display =
          "none";

      }
    );


  </script>


</body>

</html>
